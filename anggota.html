<!DOCTYPE html>

<title>Pilih Angkatan</title>

<style>

:root{
--primary:#1f2f8f;
--secondary:#19c2c2;
--gradient:linear-gradient(to bottom,#1f2f8f,#19c2c2);
--hover:#16236b;
}

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
display:flex;
flex-direction:column;
min-height:100vh;
position:relative;
}

/* LOGO BURAM */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("img/LOGO HIMAFI NO BG.png") center no-repeat;
background-size:40%;
opacity:0.08;
z-index:-1;
}

header{
color:white;
text-align:center;
padding:30px;
background:url("img/header_footer.png");
background-size:cover;
}

.breadcrumb{
padding: 0 15px;
font-size:14px;
margin:10px auto;
max-width:1000px;
}

.breadcrumb a{
text-decoration:none;
color:var(--primary);
font-weight:bold;
}

.breadcrumb a:hover{
text-decoration:underline;
}

.container{
flex:1;
max-width:1000px;
margin:auto;
padding:20px;
}

.logo-kiri{
position:absolute;
top:30px;
left:35px;
width:70px;
}

.logo-kanan{
position:absolute;
top:30px;
right:35px;
width:105px;
}

.opsi{
display:flex;
flex-direction:column;
gap:15px;
}

.opsi a{
text-decoration:none;
background:url("img/header_footer.png");
background-size:cover;
color:white;
padding:15px;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.footer-content{
max-width:1000px;
margin:auto;
text-align:center;
}

.footer-content h2{
margin:0 0 20px 0;
}

.footer-links{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
}

.footer-links a{
display:flex;
align-items:center;
justify-content:center;
width:45px;
height:45px;
text-decoration:none;
transition:0.3s;
}

.footer-links img{
width:32px;
height:32px;
object-fit:contain;
display:block;
}

.footer-links a:hover{
transform:scale(1.15);
}

.copyright{
margin-top:20px;
padding-top:15px;
border-top:1px solid rgba(255,255,255,0.25);
font-size:13px;
opacity:0.85;
}

footer{
text-align:center;
padding:30px 10px;
color:white;

background:
url("img/header_footer.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

margin-top:40px;
}
</style>
</head>

<body>

<header>
